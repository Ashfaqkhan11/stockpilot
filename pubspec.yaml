name: stockpilot
description: StockPilot Inventory Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  supabase_flutter: ^2.5.6
  image_picker: ^1.0.7
  fl_chart: ^1.2.0
  intl: ^0.20.3
  cached_network_image: ^3.3.0
  flutter_dotenv: ^6.0.1
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0B2E9C"
    theme_color: "#0B2E9C"

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo.png

  android_12:
    image: assets/logo.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"

  web: true
